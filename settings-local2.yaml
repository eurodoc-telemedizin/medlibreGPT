# poetry install --extras "ui llms-llama-cpp vector-stores-qdrant embeddings-huggingface"
server:
  env_name: ${APP_ENV:local2}

llm:
  mode: llamacpp
  # Should be matching the selected model
  max_new_tokens: 4096
  context_window: 8000
  tokenizer: google/gemma-3-12b-it
  prompt_style: "mistral"

llamacpp:
  llm_hf_repo_id: unsloth/medgemma-4b-it-GGUF
  llm_hf_model_file: medgemma-4b-it-Q4_K_M.gguf

embedding:
  mode: huggingface

huggingface:
  embedding_hf_model_name: BAAI/bge-small-en-v1.5

vectorstore:
  database: qdrant

qdrant:
  path: local_data2/private_gpt/qdrant
